<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>직접 그린 자전거 · 9프레임</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#3e352c;font-family:system-ui,sans-serif}main{max-width:680px;margin:auto;padding:32px 20px 48px}small{color:#9c3b2e;font-size:12px}h1{font-family:serif;font-size:26px;font-weight:400;margin:10px 0}p{font-size:13px;line-height:1.8;color:#756856}canvas{display:block;width:100%;max-width:432px;height:auto;margin:20px auto 8px}.controls{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}button,select{padding:10px 14px;border:1px solid #c8b99f;border-radius:6px;background:#faf6ed;color:inherit;font:inherit;font-size:13px;min-height:42px}button{cursor:pointer}input{accent-color:#9c3b2e;width:100%;margin:20px 0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9c3b2e;outline-offset:3px}output{font-size:13px;font-variant-numeric:tabular-nums}.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.strip button{padding:0;background:none;border-color:#ded3c1}.strip button.active{border-color:#9c3b2e}.strip img{display:block;width:100%;height:auto}.note{margin-top:24px;border-top:1px solid #d8cbb7;padding-top:16px}a{color:#9c3b2e}label{font-size:13px}
</style></head><body><main><small>새 드로잉 · 비교용 시안</small><h1>직접 그린 자전거, 아홉 장면</h1><p>인물부터 자전거까지 선·색·질감을 Canvas 드로잉 코드로 그렸습니다.<br>이미지 생성 AI나 기존 생성 이미지의 일부를 사용하지 않았습니다.</p><canvas id="art" width="864" height="704" role="img" aria-label="직접 그린 남성이 자전거 페달을 밟는 9프레임 애니메이션"></canvas><div class="controls"><button id="play">일시정지</button><button id="next">다음 장면</button><label>속도 <select id="speed"><option value="640">느리게</option><option value="320" selected>기본</option></select></label><output id="count">1 / 9</output></div><input id="frame" type="range" min="0" max="8" value="0" aria-label="장면 선택"><div class="strip" id="strip"></div><p><a href="bicycle-sprite.png" download>9프레임 시트 받기</a></p><p class="note">9프레임 × 320ms, 2.88초 반복입니다. 기존 그림의 복제가 아니라 같은 색조를 참고해 새로 그린 시안입니다. 운영 페이지에는 적용하지 않았습니다.</p></main><script src="draw.js"></script><script>
(()=>{const $=id=>document.getElementById(id),art=$('art'),preference=matchMedia('(prefers-reduced-motion: reduce)');let frame=0,playing=!preference.matches,delay=320,timer;const frames=[];for(let i=0;i<9;i++){const c=document.createElement('canvas');c.width=864;c.height=704;drawBicycleFrame(c,i);frames.push(c);const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`${i+1}번 장면`);const img=new Image();img.src=c.toDataURL('image/webp',.85);img.alt='';b.appendChild(img);b.onclick=()=>{playing=false;show(i);schedule();};$('strip').appendChild(b);}function show(i){frame=i;art.getContext('2d').drawImage(frames[i],0,0);$('frame').value=i;$('count').value=`${i+1} / 9`;[...$('strip').children].forEach((e,n)=>e.classList.toggle('active',n===i));}function schedule(){clearTimeout(timer);$('play').textContent=playing?'일시정지':'재생';if(playing&&!document.hidden)timer=setTimeout(()=>{show((frame+1)%9);schedule();},delay);}$('play').onclick=()=>{playing=!playing;schedule();};$('next').onclick=()=>{playing=false;show((frame+1)%9);schedule();};$('frame').oninput=e=>{playing=false;show(Number(e.target.value));schedule();};$('speed').onchange=e=>{delay=Number(e.target.value);schedule();};preference.addEventListener('change',e=>{if(e.matches){playing=false;schedule();}});document.addEventListener('visibilitychange',schedule);window.drawnPreview={show,pause:()=>{playing=false;schedule();},get playing(){return playing;},get frame(){return frame;},frames};show(0);schedule();})();
</script></body></html>
